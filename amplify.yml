version: 1
applications:
  - appRoot: .
    platform: WEB_COMPUTE
    framework: Next.js - SSR
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --legacy-peer-deps
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    environment:
      variables:
        _LIVE_UPDATES: '[{"name":"Next.js version","pkg":"next","type":"internal"}]'

